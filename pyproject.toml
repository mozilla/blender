[project]
name = "blender"
version = "0.1.0"
description = "BLEnder: automated Dependabot PR fixer and automerger"
requires-python = ">=3.11"
dependencies = [
    "PyGithub==2.9.1",
    "PyYAML==6.0.3",
    "node-semver==0.9.1",
    "packaging==26.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.1",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pin to ruff's classic default rule set. Ruff 0.16.0 changed which rules
# run under the default configuration; restore prior behavior explicitly.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
